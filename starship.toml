# Starship prompt — Catppuccin Mocha (dark), matches Ghostty's theme.
# Docs: https://starship.rs/config
#
# Layout:
#   ~/source/personal_stuv/portfolio on  main [!?] via  v20.11.0 took 3s
#   ❯
#
# Segments only appear when relevant (git info only inside a repo,
# language version only inside a matching project, duration only if
# the last command took a while).

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$java\
$csharp\
$python\
$cmd_duration
$character"""

add_newline = true

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"

[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "mauve bold"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red bold"
format = "[$all_status$ahead_behind]($style) "
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+${count}"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
style = "green bold"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "peach bold"
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
style = "sapphire bold"
format = "via [$symbol$version]($style) "

[java]
symbol = " "
style = "red bold"
format = "via [$symbol$version]($style) "

[csharp]
symbol = " "
style = "mauve bold"
format = "via [$symbol$version]($style) "

[python]
symbol = " "
style = "yellow bold"
format = "via [$symbol$version(\\($virtualenv\\))]($style) "

[cmd_duration]
min_time = 2000
style = "teal bold"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](green bold)"
